<!DOCTYPE html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Spooky Fusion Lab · Halloween Mix</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#0d0221;font-family:'Courier New',monospace;touch-action:none}
#wrap{position:fixed;inset:0;display:flex;flex-direction:column}
canvas{display:block;touch-action:none}
#topbar{position:fixed;top:env(safe-area-inset-top,8px);left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:8px 12px;z-index:10}
.title{color:#ff8c00;font-size:14px;font-weight:700;text-shadow:2px 2px 0 #6b00b6,0 0 10px #ff6b00;letter-spacing:1px}
.top-btn{background:rgba(255,140,0,.15);border:2px solid rgba(255,140,0,.4);color:#ff8c00;padding:6px 12px;border-radius:10px;font-size:12px;cursor:pointer;font-family:inherit}
.top-btn:active{transform:scale(.92)}
#pool-wrap{position:fixed;bottom:env(safe-area-inset-bottom,10px);left:0;right:0;height:90px;z-index:8;overflow:hidden;background:rgba(13,2,33,.7);border-top:2px solid rgba(255,140,0,.2)}
#pool{display:flex;gap:8px;padding:10px 12px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
#pool::-webkit-scrollbar{display:none}
.pool-item{flex:0 0 auto;width:64px;height:64px;background:rgba(107,0,182,.2);border:2px solid rgba(255,140,0,.3);border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;scroll-snap-align:start;cursor:grab;position:relative}
.pool-item.locked{opacity:.3}
.pool-item:active{cursor:grabbing}
.pool-emoji{font-size:28px;line-height:1}
.pool-name{font-size:9px;color:#ffa500;margin-top:3px;text-align:center}
#drag-ghost{position:fixed;pointer-events:none;z-index:100;font-size:44px;transform:translate(-50%,-50%);filter:drop-shadow(0 4px 8px rgba(255,140,0,.6));display:none}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:50;display:none;align-items:center;justify-content:center;padding:16px}
.modal.show{display:flex}
.modal-box{background:#1a0a2e;border:3px solid #ff8c00;border-radius:16px;max-width:92%;max-height:85vh;overflow:hidden;display:flex;flex-direction:column;width:360px;box-shadow:0 0 30px rgba(255,140,0,.3)}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:rgba(255,140,0,.12);border-bottom:2px solid rgba(255,140,0,.3)}
.modal-title{color:#ff8c00;font-size:15px;font-weight:700}
.modal-close{background:none;border:none;color:#ff8c00;font-size:22px;cursor:pointer;line-height:1}
.modal-body{padding:14px;overflow-y:auto;flex:1}
.recipe-card{background:rgba(107,0,182,.15);border:1px solid rgba(255,140,0,.2);border-radius:10px;padding:10px;margin-bottom:10px}
.recipe-top{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.recipe-emoji{font-size:32px;width:40px;text-align:center}
.recipe-name{color:#fff;font-size:14px;font-weight:700}
.recipe-desc{color:#bbb;font-size:11px;line-height:1.5;margin-bottom:4px}
.recipe-meta{color:#ff8c00;font-size:10px;display:flex;gap:10px}
.recipe-note{color:#ffd93d;font-size:11px;font-style:italic;margin-top:4px}
.sort-bar{display:flex;gap:6px;margin-bottom:10px}
.sort-btn{flex:1;background:rgba(255,140,0,.1);border:1px solid rgba(255,140,0,.3);color:#ffa500;padding:6px;border-radius:8px;font-size:11px;cursor:pointer;font-family:inherit}
.sort-btn.active{background:#ff8c00;color:#1a0a2e;font-weight:700}
#toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(13,2,33,.95);border:2px solid #ff8c00;color:#ffa500;padding:12px 20px;border-radius:12px;font-size:13px;z-index:200;opacity:0;pointer-events:none;transition:opacity .25s;text-align:center;max-width:80%}
#toast.show{opacity:1}
.tutorial-step{color:#fff;font-size:14px;line-height:1.8;text-align:center;padding:20px}
.tutorial-step .big{font-size:48px;display:block;margin-bottom:10px}
.tut-btn{background:#ff8c00;border:none;color:#1a0a2e;padding:10px 24px;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;margin-top:16px;font-family:inherit}
#result-popup{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(0);background:linear-gradient(135deg,#1a0a2e,#6b00b6);border:4px solid #ff8c00;border-radius:20px;padding:24px 30px;z-index:120;text-align:center;transition:transform .4s cubic-bezier(.34,1.56,.64,1);box-shadow:0 0 50px rgba(255,140,0,.5)}
#result-popup.show{transform:translate(-50%,-50%) scale(1)}
#result-emoji{width:170px;height:170px;margin:0 auto;filter:drop-shadow(0 0 20px rgba(255,140,0,.6))}
#result-name{color:#ff8c00;font-size:20px;font-weight:700;margin:8px 0;text-shadow:2px 2px 0 rgba(0,0,0,.5)}
#result-desc{color:#ffd93d;font-size:13px;margin-bottom:12px;max-width:240px}
#result-actions{display:flex;gap:8px;justify-content:center}
.res-btn{background:rgba(255,140,0,.25);border:2px solid #ff8c00;color:#ffa500;padding:8px 14px;border-radius:10px;font-size:12px;cursor:pointer;font-family:inherit;font-weight:700}
.res-btn:active{transform:scale(.92)}
#share-float{position:fixed;right:12px;top:50%;transform:translateY(-50%);width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,#ff8c00,#6b00b6);border:none;color:#fff;font-size:22px;cursor:pointer;z-index:9;box-shadow:0 4px 16px rgba(255,140,0,.5)}
#share-float:active{transform:translateY(-50%) scale(.9)}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
</div>
<div id="topbar">
  <div class="title">🎃 Spooky Fusion Lab</div>
  <div style="display:flex;gap:6px">
    <button class="top-btn" id="btn-album">📖 Album</button>

</div>

</div>

<div class="modal" id="album-modal">
  <div class="modal-box">
    <div class="modal-head">
      <span class="modal-title">📖 Fusion Album</span>
      <button class="modal-close" data-close="album">✕</button>

    <div class="modal-body">
      <div class="sort-bar">
        <button class="sort-btn active" data-sort="time">By Time</button>
        <button class="sort-btn" data-sort="fun">By Fun</button>
      </div>
      <div id="recipe-list"></div>
      <div style="display:flex;gap:8px;margin-top:12px">

</div>

<div class="modal" id="detail-modal">
  <div class="modal-box" style="width:300px">
    <div class="modal-head">
      <span class="modal-title" id="detail-title">Item</span>

    <div class="modal-body" style="text-align:center">
      <div id="detail-emoji" style="font-size:64px;margin:10px 0"></div>

      <span class="big">👆</span>
      <div>Drag an item from the pool<br>into the fusion circle</div>
      <button class="tut-btn" id="tut-next">Next</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
(()=>{
'use strict';
const C=document.getElementById('c');
const ctx=C.getContext('2d');
let DPR=Math.min(window.devicePixelRatio||1,3);
function resize(){DPR=Math.min(window.devicePixelRatio||1,3);C.width=innerWidth*DPR;C.height=innerHeight*DPR;ctx.setTransform(DPR,0,0,DPR,0,0)}
resize();addEventListener('resize',resize);

// ===== Audio =====
let AC=null;
function ac(){if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();return AC}
function tone(f,d,t='sine',v=.25,s=0){const a=ac();const o=a.createOscillator();const g=a.createGain();o.type=t;o.frequency.value=f;if(s)o.frequency.exponentialRampToValueAtTime(Math.max(20,f+s),a.currentTime+d);g.gain.value=v;g.gain.exponentialRampToValueAtTime(.001,a.currentTime+d);o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+d)}
function sndDrop(){tone(220,.12,'sawtooth',.25,120)}
function sndFuse(){const a=ac();[300,500,700,900].forEach((f,i)=>{const o=a.createOscillator();const g=a.createGain();o.type='sawtooth';o.frequency.value=f;const t=a.currentTime+i*.12;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.18,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+.2);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+.2)})}
function sndPop(){tone(600,.08,'square',.3,-400)}
function sndCackle(){[400,350,450,300].forEach((f,i)=>setTimeout(()=>tone(f,.1,'square',.2),i*70))}
function sndUnlock(){[330,392,440,523].forEach((f,i)=>setTimeout(()=>tone(f,.2,'triangle',.22),i*100))}

// ===== Data: Halloween items =====
const BASE_ITEMS=[
  {id:'pumpkin',emoji:'🎃',name:'Pumpkin',desc:'A grinning jack-o-lantern with a fiery glow'},
  {id:'ghost',emoji:'👻',name:'Ghost',desc:'Boo! A friendly floating spirit'},
  {id:'bat',emoji:'🦇',name:'Bat',desc:'Flutters through the midnight sky'},
  {id:'vampire',emoji:'🧛',name:'Vampire',desc:'Vants to suck your blood... politely'},
  {id:'zombie',emoji:'🧟',name:'Zombie',desc:'Braaaains... and maybe a snack'},
  {id:'spider',emoji:'🕷️',name:'Spider',desc:'Weaves spooky webs in dark corners'},
  {id:'candy',emoji:'🍬',name:'Candy',desc:'Trick or treat sugar rush'},
  {id:'moon',emoji:'🌙',name:'Moon',desc:'A crescent that watches over the night'},
  {id:'candle',emoji:'🕯️',name:'Candle',desc:'Flickers with an eerie orange flame'},
  {id:'skull',emoji:'💀',name:'Skull',desc:'Dead but still judging you'},
  {id:'witch',emoji:'🧙',name:'Witch',desc:'Cackles while brewing potions'},
  {id:'bone',emoji:'🦴',name:'Bone',desc:'A leftover from... something'},
  {id:'crystal',emoji:'🔮',name:'Crystal Ball',desc:'Sees all your spooky secrets'},
  {id:'tombstone',emoji:'🪦',name:'Tombstone',desc:'R.I.P. Your Halloween candy'},
  {id:'mask',emoji:'🎭',name:'Mask',desc:'Hides a terrifyingly cute face'},
  {id:'coffin',emoji:'⚰️',name:'Coffin',desc:'Comfortable with a silk lining'},
  {id:'owl',emoji:'🦉',name:'Owl',desc:'Hoots at midnight, knows too much',locked:true},
  {id:'broom',emoji:'🧹',name:'Broom',desc:'A witch\'s loyal ride',locked:true},
  {id:'blackcat',emoji:'🐈‍⬛',name:'Black Cat',desc:'Crosses your path for luck',locked:true},
  {id:'cauldron',emoji:'🫕',name:'Cauldron',desc:'Bubbling with mysterious brew',locked:true},
  {id:'scythe',emoji:'⚒️',name:'Scythe',desc:'Grim but oddly fashionable',locked:true},
];
const itemMap={};BASE_ITEMS.forEach(i=>itemMap[i.id]=i);

// ===== Fusion recipes (Halloween) =====
const FUSION_RECIPES={
  'pumpkin+ghost':{name:'Pumpkin Ghost',desc:'A glowing spirit that haunts pumpkin patches',fun:9},
  'ghost+pumpkin':{name:'Pumpkin Ghost',desc:'A glowing spirit that haunts pumpkin patches',fun:9},
  'bat+vampire':{name:'Batpire',desc:'Half bat, half vampire, all drama',fun:9},
  'vampire+bat':{name:'Batpire',desc:'Half bat, half vampire, all drama',fun:9},
  'skull+candle':{name:'Candle Skull',desc:'Eyes replaced with flickering flames',fun:9},
  'candle+skull':{name:'Candle Skull',desc:'Eyes replaced with flickering flames',fun:9},
  'witch+broom':{name:'Witch on Broom',desc:'Vroom vroom, broom goes brrr',fun:10},
  'broom+witch':{name:'Witch on Broom',desc:'Vroom vroom, broom goes brrr',fun:10},
  'zombie+skull':{name:'Skull Zombie',desc:'Mostly bones, still wants brains',fun:8},
  'skull+zombie':{name:'Skull Zombie',desc:'Mostly bones, still wants brains',fun:8},
  'pumpkin+spider':{name:'Spider Pumpkin',desc:'Eight legs of pure pumpkin chaos',fun:8},
  'spider+pumpkin':{name:'Spider Pumpkin',desc:'Eight legs of pure pumpkin chaos',fun:8},
  'ghost+skull':{name:'Ghost Skull',desc:'A skull that floats and says boo',fun:8},
  'skull+ghost':{name:'Ghost Skull',desc:'A skull that floats and says boo',fun:8},
  'candy+pumpkin':{name:'Candy Pumpkin',desc:'Sweet on the outside, seeds on the inside',fun:7},
  'pumpkin+candy':{name:'Candy Pumpkin',desc:'Sweet on the outside, seeds on the inside',fun:7},
  'moon+bat':{name:'Moon Bat',desc:'A bat made of moonlight',fun:8},
  'bat+moon':{name:'Moon Bat',desc:'A bat made of moonlight',fun:8},
  'crystal+skull':{name:'Crystal Skull',desc:'Glows with ancient spooky power',fun:10},
  'skull+crystal':{name:'Crystal Skull',desc:'Glows with ancient spooky power',fun:10},
  'witch+crystal':{name:'Fortune Witch',desc:'Reads your fate in the brew',fun:8},
  'crystal+witch':{name:'Fortune Witch',desc:'Reads your fate in the brew',fun:8},
  'tombstone+skull':{name:'Tomb Skull',desc:'Risen from the grave for candy',fun:8},
  'skull+tombstone':{name:'Tomb Skull',desc:'Risen from the grave for candy',fun:8},
  'coffin+vampire':{name:'Vampire Coffin',desc:'Wakes up at sunset, hungry',fun:9},
  'vampire+coffin':{name:'Vampire Coffin',desc:'Wakes up at sunset, hungry',fun:9},
  'mask+ghost':{name:'Masked Ghost',desc:'A ghost in disguise... somehow',fun:7},
  'ghost+mask':{name:'Masked Ghost',desc:'A ghost in disguise... somehow',fun:7},
  'bone+dog':{name:'Bone',desc:'A very good boy\'s treasure',fun:7},
  'owl+moon':{name:'Night Owl',desc:'Hoots under the moon, sees all',fun:8},
  'moon+owl':{name:'Night Owl',desc:'Hoots under the moon, sees all',fun:8},
  'cauldron+witch':{name:'Brew Witch',desc:'Stirs a bubbling green potion',fun:9},
  'witch+cauldron':{name:'Brew Witch',desc:'Stirs a bubbling green potion',fun:9},
  'blackcat+pumpkin':{name:'Cat O\' Lantern',desc:'A cat that glows from within',fun:9},
  'pumpkin+blackcat':{name:'Cat O\' Lantern',desc:'A cat that glows from within',fun:9},
  'scythe+skull':{name:'Grim Pumpkin',desc:'The reaper took a Halloween break',fun:10},
  'skull+scythe':{name:'Grim Pumpkin',desc:'The reaper took a Halloween break',fun:10},
  'spider+web':{name:'Spider Web',desc:'An intricate trap for candy thieves',fun:7},
  'candy+ghost':{name:'Candy Ghost',desc:'Sweet but spooky, like a sour candy',fun:8},
  'ghost+candy':{name:'Candy Ghost',desc:'Sweet but spooky, like a sour candy',fun:8},
  'zombie+candy':{name:'Candy Zombie',desc:'Brains... replaced with candy corn',fun:8},
  'candy+zombie':{name:'Candy Zombie',desc:'Brains... replaced with candy corn',fun:8},
  'bone+skull':{name:'Skeleton',desc:'Dances when no one\'s watching',fun:9},
  'skull+bone':{name:'Skeleton',desc:'Dances when no one\'s watching',fun:9},
};

// random fusion generator
const NAME_PARTS_A=['Spooky','Eerie','Creepy','Ghoulish','Wicked','Haunted','Cursed','Freaky','Sinister','Bizarre','Macabre','Phantom'];
const NAME_PARTS_B=['Fusion','Hybrid','Mutant','Horror','Creature','Abomination','Specter','Wraith','Mishmash','Blend'];
const DESCS=[
  'Looks wrong but feels right','Has an unsettling charm','Whispers secrets at midnight','Glows with an unholy light','Cackles when you\'re not looking','Smells like pumpkin spice and fear','Moves on its own!','Hungers for candy','Nobody knows how it exists','Slightly on fire','Mimics your voice','A legend told around campfires','Seems to be humming a tune','Has too many eyes','Teleports when blinked at','Heavier than it looks','Sleeps upside down','Allergic to sunlight','Loves thunderstorms','Is definitely left-handed',
];

function hashStr(s){let h=0;for(let i=0;i<s.length;i++)h=((h<<5)-h+s.charCodeAt(i))|0;return Math.abs(h)}

function generateFusion(a,b){
  const key=a.id+'+'+b.id;
  if(FUSION_RECIPES[key]){
    const r=FUSION_RECIPES[key];
    return{...r,ra:a.id,rb:b.id,time:Date.now()};
  }
  const h=hashStr(a.name+b.name+Date.now());
  const name=NAME_PARTS_A[h%NAME_PARTS_A.length]+' '+a.name+' '+NAME_PARTS_B[(h>>3)%NAME_PARTS_B.length];
  const desc=DESCS[h%DESCS.length];
  const fun=3+(h%7);
  return{name,desc,fun,ra:a.id,rb:b.id,time:Date.now()};
}

// ===== State =====
const state={
  album:JSON.parse(localStorage.getItem('sfl_album')||'[]'),
  unlocked:JSON.parse(localStorage.getItem('sfl_unlocked')||'["pumpkin","ghost","bat","vampire","zombie","spider","candy","moon","candle","skull","witch","bone","crystal","tombstone","mask","coffin"]'),
  slot1:null,slot2:null,
  fusing:false,
  fuseT:0,
  particles:[],
  ripples:[],
  glow:0,
  result:null,
  sort:'time',
  floaters:[],
};
function save(){localStorage.setItem('sfl_album',JSON.stringify(state.album));localStorage.setItem('sfl_unlocked',JSON.stringify(state.unlocked))}
function isUnlocked(id){return state.unlocked.includes(id)}

// ===== UI: pool =====
const pool=document.getElementById('pool');
function renderPool(){
  pool.innerHTML='';
  BASE_ITEMS.forEach(it=>{
    const div=document.createElement('div');
    div.className='pool-item'+(isUnlocked(it.id)?'':' locked');
    div.dataset.id=it.id;
    div.innerHTML=`<div class="pool-emoji">${isUnlocked(it.id)?it.emoji:'🔒'}</div><div class="pool-name">${it.name}</div>`;
    if(!isUnlocked(it.id))return;
    let startX,startY,moved=false,longT,moveH,upH;
    function onStart(e){
      e.preventDefault();
      const t=e.touches?e.touches[0]:e;
      startX=t.clientX;startY=t.clientY;moved=false;
      const a=ac();if(a.state==='suspended')a.resume();
      longT=setTimeout(()=>showDetail(it),600);
      moveH=ev=>{
        const p=ev.touches?ev.touches[0]:ev;
        if(Math.hypot(p.clientX-startX,p.clientY-startY)>8){
          moved=true;clearTimeout(longT);
          dragGhost.style.display='block';
          dragGhost.textContent=it.emoji;
          dragGhost.style.left=p.clientX+'px';
          dragGhost.style.top=p.clientY+'px';
          draggingItem=it;
        }else if(draggingItem){
          dragGhost.style.left=p.clientX+'px';
          dragGhost.style.top=p.clientY+'px';
        }
      };
      upH=ev=>{
        clearTimeout(longT);
        document.removeEventListener('mousemove',moveH);
        document.removeEventListener('mouseup',upH);
        document.removeEventListener('touchmove',moveH);
        document.removeEventListener('touchend',upH);
        if(moved&&draggingItem){
          const p=ev.changedTouches?ev.changedTouches[0]:ev;
          handleDrop(p.clientX,p.clientY);
        }
        dragGhost.style.display='none';
        draggingItem=null;
      };
      if(e.touches){
        document.addEventListener('touchmove',moveH,{passive:false});
        document.addEventListener('touchend',upH);
      }else{
        document.addEventListener('mousemove',moveH);
        document.addEventListener('mouseup',upH);
      }
    }
    div.addEventListener('touchstart',onStart,{passive:false});
    div.addEventListener('mousedown',onStart);
    div.addEventListener('dblclick',()=>showDetail(it));
    pool.appendChild(div);
  });
}
let draggingItem=null;
const dragGhost=document.getElementById('drag-ghost');

// ===== Fusion circle =====
function getCircle(){
  const cx=innerWidth/2,cy=innerHeight/2-20;
  const r=Math.min(innerWidth,innerHeight)*0.16;
  return{cx,cy,r};
}
function handleDrop(x,y){
  const c=getCircle();
  const d=Math.hypot(x-c.cx,y-c.cy);
  if(d>c.r*1.5)return;
  if(!state.slot1){state.slot1=draggingItem;sndDrop();addRipple(x,y)}
  else if(!state.slot2&&draggingItem.id!==state.slot1.id){state.slot2=draggingItem;sndDrop();addRipple(x,y);tryFuse()}
  else if(!state.slot2&&draggingItem.id===state.slot1.id){sndDrop();addRipple(x,y)}
}
function tryFuse(){
  if(state.slot1&&state.slot2&&!state.fusing){
    state.fusing=true;state.fuseT=0;
    sndFuse();
    state.glow=1;
    const c=getCircle();
    for(let i=0;i<30;i++){
      const a=Math.random()*Math.PI*2,sp=2+Math.random()*6;
      const hue=[25,40,280,320][Math.floor(Math.random()*4)];
      state.particles.push({x:c.cx,y:c.cy,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1,color:`hsl(${hue},90%,60%)`,size:3+Math.random()*5});
    }
    setTimeout(()=>{
      const res=generateFusion(state.slot1,state.slot2);
      state.result=res;
      state.album.unshift(res);
      if(state.album.length>200)state.album.pop();
      checkUnlocks();
      save();
      showResult(res);
      sndCackle();
      state.fusing=false;state.slot1=null;state.slot2=null;
    },2000);
  }
}
function checkUnlocks(){
  const unique=new Set(state.album.map(r=>r.ra+'+'+r.rb));
  const n=unique.size;
  const unlocks={5:'owl',10:'broom',20:'blackcat'};
  Object.keys(unlocks).forEach(k=>{
    if(n>=+k&&!state.unlocked.includes(unlocks[k])){
      state.unlocked.push(unlocks[k]);
      sndUnlock();
      toast('🎉 Unlocked: '+itemMap[unlocks[k]].name);
    }
  });
  const rareCount=state.album.filter(r=>r.fun>=8).length;
  if(rareCount>=3&&!state.unlocked.includes('cauldron')){state.unlocked.push('cauldron');sndUnlock();toast('🫕 Rare unlock: Cauldron!')}
  if(rareCount>=6&&!state.unlocked.includes('scythe')){state.unlocked.push('scythe');sndUnlock();toast('⚒️ Rare unlock: Scythe!')}
  renderPool();
}

// ===== particles & ripples =====
function addRipple(x,y){state.ripples.push({x,y,r:5,max:80,life:1})}
function updateFx(){
  state.particles=state.particles.filter(p=>p.life>0);
  state.particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.15;p.life-=.025;p.vx*=.98});
  state.ripples=state.ripples.filter(r=>r.life>0);
  state.ripples.forEach(r=>{r.r+=(r.max-r.r)*0.15;r.life-=.05});
  state.glow*=.96;
  if(state.fusing)state.fuseT++;
  // floating decorations (bats/pumpkins)
  if(Math.random()<0.015){
    const isBat=Math.random()>0.5;
    state.floaters.push({x:-20,y:Math.random()*innerHeight*0.6,sp:1+Math.random()*2,emoji:isBat?'🦇':'🎃',size:14+Math.random()*14,life:1});
  }
  state.floaters=state.floaters.filter(f=>{f.x+=f.sp;f.y+=Math.sin(f.x*0.02)*0.5;return f.x<innerWidth+30});
}

// ===== Render =====
function render(){
  const w=innerWidth,h=innerHeight;
  // Halloween gradient bg
  const g=ctx.createLinearGradient(0,0,0,h);
  g.addColorStop(0,'#0d0221');g.addColorStop(0.5,'#1a0a2e');g.addColorStop(1,'#2d0a4e');
  ctx.fillStyle=g;ctx.fillRect(0,0,w,h);
  
  updateFx();
  
  // floating decorations
  state.floaters.forEach(f=>{
    ctx.globalAlpha=0.5;
    ctx.font=f.size+'px serif';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(f.emoji,f.x,f.y);
  });
  ctx.globalAlpha=1;
  
  // ripples
  state.ripples.forEach(r=>{
    ctx.strokeStyle=`rgba(255,140,0,${r.life*0.6})`;ctx.lineWidth=3;
    ctx.beginPath();ctx.arc(r.x,r.y,r.r,0,Math.PI*2);ctx.stroke();
  });
  
  const c=getCircle();
  
  // fusion glow
  if(state.glow>0.05||state.fusing){
    const glowR=c.r*(1.5+state.glow*1.5+Math.sin(state.fuseT*0.3)*0.3);
    const grad=ctx.createRadialGradient(c.cx,c.cy,0,c.cx,c.cy,glowR);
    grad.addColorStop(0,`rgba(255,140,0,${0.5*state.glow})`);
    grad.addColorStop(0.5,`rgba(107,0,182,${0.4*state.glow})`);
    grad.addColorStop(1,'rgba(0,255,100,0)');
    ctx.fillStyle=grad;ctx.beginPath();ctx.arc(c.cx,c.cy,glowR,0,Math.PI*2);ctx.fill();
  }
  
  // fusion circle
  ctx.strokeStyle=state.fusing?'#ff8c00':'rgba(255,140,0,0.35)';
  ctx.lineWidth=state.fusing?4:3;
  ctx.setLineDash(state.fusing?[]:[8,6]);
  ctx.beginPath();ctx.arc(c.cx,c.cy,c.r,0,Math.PI*2);ctx.stroke();
  ctx.setLineDash([]);
  
  if(!state.slot1&&!state.slot2){
    ctx.fillStyle='rgba(255,140,0,0.5)';ctx.font='14px monospace';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('Drop 2 items here',c.cx,c.cy);
  }
  
  if(state.slot1){
    ctx.font=(c.r*0.7)+'px serif';ctx.textAlign='center';ctx.textBaseline='middle';
    const off=state.fusing?Math.sin(state.fuseT*0.5)*15:0;
    ctx.fillText(state.slot1.emoji,c.cx-c.r*0.4+off,c.cy);
  }
  if(state.slot2){
    ctx.font=(c.r*0.7)+'px serif';ctx.textAlign='center';ctx.textBaseline='middle';
    const off=state.fusing?Math.sin(state.fuseT*0.5+Math.PI)*15:0;
    ctx.fillText(state.slot2.emoji,c.cx+c.r*0.4+off,c.cy);
  }
  if(state.fusing){
    ctx.fillStyle='#ff8c00';ctx.font=(c.r*0.5)+'px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('✦',c.cx,c.cy);
    const pct=state.fuseT/120;
    ctx.strokeStyle='#6b00b6';ctx.lineWidth=5;
    ctx.beginPath();ctx.arc(c.cx,c.cy,c.r+10,-Math.PI/2,-Math.PI/2+pct*Math.PI*2);ctx.stroke();
  }
  
  state.particles.forEach(p=>{
    ctx.globalAlpha=p.life;ctx.fillStyle=p.color;
    ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,Math.PI*2);ctx.fill();
  });
  ctx.globalAlpha=1;
  
  requestAnimationFrame(render);
}
render();
renderPool();

// ===== Fusion Visual: split-merge into ONE chimera (clip-based, reliable) =====
function drawFusionVisual(canvas, emojiA, emojiB) {
  const ctx = canvas.getContext('2d');
  const S = 340;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  if (canvas.width !== S * dpr) { canvas.width = S * dpr; canvas.height = S * dpr; }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, S, S);
  const cx = S / 2, cy = S / 2;
  const t = Date.now() * 0.001;

  // Halloween neon glow background
  const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, S * 0.5);
  grad.addColorStop(0, 'rgba(255,140,0,0.5)');
  grad.addColorStop(0.4, 'rgba(107,0,182,0.4)');
  grad.addColorStop(0.75, 'rgba(0,200,100,0.2)');
  grad.addColorStop(1, 'rgba(13,2,33,0)');
  ctx.fillStyle = grad;
  ctx.beginPath(); ctx.arc(cx, cy, S * 0.5, 0, Math.PI * 2); ctx.fill();

  // rotating sparkle ring
  for (let i = 0; i < 10; i++) {
    const ang = t * 0.8 + (i / 10) * Math.PI * 2;
    const r = S * 0.42;
    const sx = cx + Math.cos(ang) * r;
    const sy = cy + Math.sin(ang) * r;
    const col = i % 2 === 0 ? 'rgba(255,140,0,' : 'rgba(0,255,100,';
    ctx.fillStyle = col + (0.5 + Math.sin(t * 3 + i) * 0.3) + ')';
    ctx.beginPath(); ctx.arc(sx, sy, 2 + Math.sin(t * 4 + i) * 1.5, 0, Math.PI * 2); ctx.fill();
  }

  // === Chimera: left half = A, right half = B, soft blended middle ===
  const pulse = 1 + Math.sin(t * 2) * 0.035;
  const fontSize = S * 0.62 * pulse;
  const drawEmoji = (e, alpha) => {
    ctx.globalAlpha = alpha;
    ctx.font = `${fontSize}px serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.shadowColor = 'rgba(0,0,0,0.4)'; ctx.shadowBlur = 12;
    ctx.fillText(e, cx, cy);
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1;
  };

  const leftEdge = S * 0.38;   // A fully opaque left of this
  const rightEdge = S * 0.62;  // B fully opaque right of this

  // 1) Left zone: draw A (clipped to left 42%)
  ctx.save();
  ctx.beginPath(); ctx.rect(0, 0, leftEdge, S); ctx.clip();
  drawEmoji(emojiA, 1);
  ctx.restore();

  // 2) Middle blend zone (38%-62%): draw A at fading alpha + B at rising alpha
  //    We approximate the soft gradient with a few sub-strips for smoothness
  const strips = 8;
  for (let i = 0; i < strips; i++) {
    const x0 = leftEdge + (rightEdge - leftEdge) * (i / strips);
    const x1 = leftEdge + (rightEdge - leftEdge) * ((i + 1) / strips);
    const mid = (x0 + x1) / 2 / S;
    const aAlpha = 1 - (mid - 0.38) / 0.24;   // A fades 1→0 across middle
    const bAlpha = (mid - 0.38) / 0.24;       // B rises 0→1 across middle
    ctx.save();
    ctx.beginPath(); ctx.rect(x0, 0, x1 - x0, S); ctx.clip();
    drawEmoji(emojiA, Math.max(0, aAlpha));
    drawEmoji(emojiB, Math.max(0, bAlpha));
    ctx.restore();
  }

  // 3) Right zone: draw B (clipped to right 42%)
  ctx.save();
  ctx.beginPath(); ctx.rect(rightEdge, 0, S - rightEdge, S); ctx.clip();
  drawEmoji(emojiB, 1);
  ctx.restore();

  // soft golden seam glow down the middle
  const seam = ctx.createLinearGradient(cx - S * 0.05, 0, cx + S * 0.05, 0);
  seam.addColorStop(0, 'rgba(255,215,0,0)');
  seam.addColorStop(0.5, `rgba(255,215,0,${0.3 + Math.sin(t * 3) * 0.12})`);
  seam.addColorStop(1, 'rgba(255,215,0,0)');
  ctx.fillStyle = seam;
  ctx.fillRect(cx - S * 0.05, cy - S * 0.42, S * 0.1, S * 0.84);

  // unified pulsing aura
  const auraR = S * 0.34 + Math.sin(t * 2.5) * 6;
  const aura = ctx.createRadialGradient(cx, cy, S * 0.12, cx, cy, auraR);
  aura.addColorStop(0, 'rgba(255,140,0,0)');
  aura.addColorStop(0.6, `rgba(255,140,0,${0.22 + Math.sin(t * 2) * 0.08})`);
  aura.addColorStop(1, 'rgba(107,0,182,0)');
  ctx.fillStyle = aura;
  ctx.beginPath(); ctx.arc(cx, cy, auraR, 0, Math.PI * 2); ctx.fill();
}

let fusionAnimId = null;
function animateFusionVisual(emojiA, emojiB) {
  const canvas = document.getElementById('result-emoji');
  if (fusionAnimId) cancelAnimationFrame(fusionAnimId);
  function loop() {
    drawFusionVisual(canvas, emojiA, emojiB);
    fusionAnimId = requestAnimationFrame(loop);
  }
  loop();
}

// ===== Result popup =====
const popup = document.getElementById('result-popup');
function showResult(r) {
  const a = itemMap[r.ra], b = itemMap[r.rb];
  animateFusionVisual(a.emoji, b.emoji);
  document.getElementById('result-name').textContent = r.name;
  document.getElementById('result-desc').textContent = r.desc;
  popup.classList.add('show');
}
document.getElementById('res-close').onclick=()=>{popup.classList.remove('show');if(fusionAnimId){cancelAnimationFrame(fusionAnimId);fusionAnimId=null}};
document.getElementById('res-copy').onclick=()=>{
  const r=state.result;if(!r)return;
  const a=itemMap[r.ra],b=itemMap[r.rb];
  const txt=`🎃 ${a.emoji} + ${b.emoji} = ${r.name}\n${r.desc}\nRecipe: ${a.name} + ${b.name}\n#SpookyFusionLab`;
  navigator.clipboard.writeText(txt).then(()=>toast('📋 Copied!')).catch(()=>{
    const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();toast('📋 Copied!');
  });
};

// ===== Album =====
const albumModal=document.getElementById('album-modal');
function renderAlbum(){
  const list=document.getElementById('recipe-list');
  let arr=[...state.album];
  if(state.sort==='fun')arr.sort((a,b)=>b.fun-a.fun);
  if(arr.length===0){list.innerHTML='<div style="color:#888;text-align:center;padding:30px">No fusions yet!<br>Start mixing spooky things!</div>';return}
  list.innerHTML=arr.map(r=>{
    const a=itemMap[r.ra],b=itemMap[r.rb];
    return`
    <div class="recipe-card" data-time="${r.time}">
      <div class="recipe-top">
        <span class="recipe-emoji">${a?a.emoji:'❓'}<span style="font-size:16px">${b?b.emoji:'❓'}</span></span>
        <div>
          <div class="recipe-name">${r.name}</div>
          <div class="recipe-meta"><span>${a?a.name:'?'} + ${b?b.name:'?'}</span><span>Fun ${r.fun}/10</span></div>
        </div>
      </div>
      <div class="recipe-desc">${r.desc}</div>
      ${r.note?`<div class="recipe-note">📝 ${r.note}</div>`:''}
    </div>
  `}).join('');
  list.querySelectorAll('.recipe-card').forEach(card=>{
    let t;
    const time=+card.dataset.time;
    const start=()=>{t=setTimeout(()=>{
      const r=state.album.find(x=>x.time===time);if(!r)return;
      const note=prompt('Add a note to this recipe:',r.note||'');
      if(note!==null){r.note=note;save();renderAlbum();toast('📝 Note saved!')}
    },600)};
    const cancel=()=>clearTimeout(t);
    card.addEventListener('touchstart',start,{passive:true});
    card.addEventListener('touchend',cancel);
    card.addEventListener('touchmove',cancel);
    card.addEventListener('mousedown',start);
    card.addEventListener('mouseup',cancel);
    card.addEventListener('mouseleave',cancel);
  });
}
document.getElementById('btn-album').onclick=()=>{renderAlbum();albumModal.classList.add('show')};
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>document.getElementById(b.dataset.close+'-modal').classList.remove('show'));
document.querySelectorAll('.sort-btn[data-sort]').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.sort-btn[data-sort]').forEach(x=>x.classList.remove('active'));
  b.classList.add('active');state.sort=b.dataset.sort;renderAlbum();
});
document.getElementById('btn-backup').onclick=()=>{
  const data={album:state.album,unlocked:state.unlocked};
  const blob=new Blob([JSON.stringify(data)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='spooky-fusion-backup.json';a.click();
  toast('💾 Backup downloaded!');
};
document.getElementById('btn-restore').onclick=()=>{
  const inp=document.createElement('input');inp.type='file';inp.accept='.json';
  inp.onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{
    try{const d=JSON.parse(r.result);state.album=d.album||[];state.unlocked=d.unlocked||state.unlocked;save();renderPool();renderAlbum();toast('♻️ Restored!')}catch(err){toast('❌ Invalid file')}
  };r.readAsText(f)};inp.click();
};

// ===== Detail =====
function showDetail(it){
  document.getElementById('detail-emoji').textContent=it.emoji;
  document.getElementById('detail-name').textContent=it.name;
  document.getElementById('detail-desc').textContent=it.desc;
  document.getElementById('detail-rarity').textContent=it.locked?'🔒 Rare Item':'Basic Item';
  document.getElementById('detail-title').textContent='Item Details';
  document.getElementById('detail-modal').classList.add('show');
}

// ===== Reset =====
document.getElementById('btn-reset').onclick=()=>{
  if(confirm('Clear fusion circle?')){state.slot1=null;state.slot2=null;state.fusing=false;toast('🔄 Circle cleared')}
};

// ===== Share =====
document.getElementById('share-float').onclick=()=>{
  if(state.album.length===0){toast('No fusions to share yet');return}
  const r=state.album[0];
  const a=itemMap[r.ra],b=itemMap[r.rb];
  const txt=`🎃 ${a.emoji} + ${b.emoji} = ${r.name}\n${r.desc}\nFun level: ${r.fun}/10\n#SpookyFusionLab #Halloween`;
  navigator.clipboard.writeText(txt).then(()=>toast('📋 Recipe copied!')).catch(()=>toast('Copy failed'));
};

// ===== Toast =====
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('show'),1800)}

// ===== Tutorial =====
const tutSteps=[
  {big:'👆',text:'Drag an item from the pool<br>into the fusion circle'},
  {big:'✦',text:'Drop a second item<br>and wait 2 seconds for the spooky fusion!'},
  {big:'📖',text:'Tap Album to view all recipes<br>Long-press to add notes'},
];
let tutIdx=0;
const tutModal=document.getElementById('tut-modal');
const tutStep=document.getElementById('tut-step');
function updateTut(){
  const s=tutSteps[tutIdx];
  tutStep.innerHTML=`<span class="big">${s.big}</span><div>${s.text}</div><button class="tut-btn" id="tut-next">${tutIdx<tutSteps.length-1?'Next':'Start Fusing!'}</button>`;
  document.getElementById('tut-next').onclick=()=>{
    tutIdx++;
    if(tutIdx>=tutSteps.length){tutModal.classList.remove('show');localStorage.setItem('sfl_tut','1')}
    else updateTut();
  };
}
if(localStorage.getItem('sfl_tut'))tutModal.classList.remove('show');
updateTut();

})();
</script>
